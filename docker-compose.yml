# docker-compose.yml
# Run the entire stack locally with: docker-compose up --build

version: '3.9'

services:
  # ── MySQL Database ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: devchat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devchat
      MYSQL_USER: devchat_user
      MYSQL_PASSWORD: devchat_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: devchat_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: devchat_user
      DB_PASSWORD: devchat_pass
      DB_NAME: devchat
      JWT_SECRET: change_this_secret_in_production_!!
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
      FRONTEND_URL: http://localhost:3000
    ports:
      - '5000:5000'

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: devchat_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_SOCKET_URL: http://localhost:5000
    ports:
      - '3000:80'

volumes:
  mysql_data:
